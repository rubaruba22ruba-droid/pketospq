<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<title>.tron mrkt</title>
<style>
:root{--bg:#0e0a14;--s:#1a1424;--s2:#251c33;--red:#ff2a3d;--yel:#ffd23f;--grn:#2fe08a;--blu:#4d8dff;--tx:#fff6ee;--mut:#a89bb8}
*{box-sizing:border-box;margin:0;font-family:Manrope,sans-serif;font-weight:600;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);padding:14px 14px 120px;min-height:100vh}
body:before{content:"";position:fixed;inset:-20% -20% auto auto;width:340px;height:340px;background:var(--red);opacity:.16;filter:blur(90px);border-radius:50%;z-index:-1}
h1,h2,.pill,.tab,.btn,.pr{font-family:'Baloo 2',cursive;font-weight:800}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.coin{width:44px;height:44px;border-radius:15px;background:var(--red);display:grid;place-items:center;font:800 26px 'Baloo 2';box-shadow:0 4px 0 #a3101d;transform:rotate(-6deg)}
h1{font-size:25px;line-height:1}h1 span{color:var(--red)}
.pill{margin-left:auto;background:var(--s2);border-radius:999px;padding:7px 14px;font-size:17px;color:var(--yel);box-shadow:0 3px 0 #0006}
.card{background:var(--s);border-radius:26px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gift{background:var(--s);border-radius:26px;padding:7px 7px 10px;transition:transform .15s}.gift:active{transform:scale(.97)}
.gift .im{position:relative;border-radius:21px;overflow:hidden;aspect-ratio:1}.gift img{width:100%;height:100%;display:block;object-fit:cover;background:var(--s2)}
.pr{position:absolute;left:8px;bottom:8px;background:#000a;backdrop-filter:blur(6px);border-radius:12px;padding:2px 10px;font-size:16px;color:var(--yel)}
.gift b{display:block;margin:9px 5px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{width:100%;border:0;border-radius:16px;padding:10px;font-size:17px;color:#1b0f00;background:var(--grn);box-shadow:0 5px 0 #168a53;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0}.btn.b{background:var(--blu);color:#fff;box-shadow:0 5px 0 #2a56b0}.btn.r{background:var(--red);color:#fff;box-shadow:0 5px 0 #a3101d}.btn.y{background:var(--yel);box-shadow:0 5px 0 #b38d00}
.btn.s{padding:6px 12px;font-size:14px;width:auto;box-shadow:0 3px 0 #0006}
input{width:100%;border:2px solid var(--s2);border-radius:15px;padding:12px;font-size:16px;background:var(--bg);color:var(--tx);margin-bottom:10px;outline:none}input:focus{border-color:var(--red)}
.gift small{display:block;margin:-4px 5px 8px;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}.chip{border-radius:999px;padding:7px 14px;background:var(--s);font-size:14px;font-family:'Baloo 2';font-weight:700}.chip.on{background:var(--red)}
.k{font-size:26px;padding:4px 10px}
.nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:4px;background:#1a1424ee;backdrop-filter:blur(14px);border-radius:28px;padding:6px;box-shadow:0 8px 30px #000a}
.tab{flex:1;text-align:center;padding:7px 2px;border-radius:21px;font-size:13px;line-height:1.1;color:var(--mut)}.tab i{display:block;font-style:normal;font-size:22px}.tab.on{background:var(--red);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--s2);font-size:14px}.row:last-child{border:0}
.st{border-radius:8px;padding:1px 8px;font-size:12px}.active{background:#2fe08a33;color:var(--grn)}.sold{background:#ff2a3d33;color:var(--red)}.pending{background:#ffd23f33;color:var(--yel)}
.empty{text-align:center;padding:36px 10px;color:var(--mut)}.empty .e{font-size:56px}
p{color:var(--mut);font-size:14px;margin:6px 0 12px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:16px;z-index:9;max-width:90%;font-weight:800}
.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.9);opacity:0}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
</style></head><body>
<div class="top"><div class="coin">T</div><h1>.tron <span>mrkt</span></h1><div class="pill" id="bal">…</div></div>
<div id="v"></div><div class="nav" id="nav"></div>
<script>
const tg=window.Telegram?.WebApp||{initData:"",ready(){},expand(){},openLink:u=>open(u)};tg.ready();tg.expand();
const qs=new URLSearchParams(location.search);if(qs.get("api"))try{localStorage.api=qs.get("api")}catch(e){}
const API=(qs.get("api")||(()=>{try{return localStorage.api}catch(e){}})()||window.API_URL||location.origin).replace(/\/$/,"");
const NAMES=['Santa Hat', 'Signet Ring', 'Precious Peach', 'Plush Pepe', 'Spiced Wine', 'Jelly Bunny', "Durov's Cap", 'Perfume Bottle', 'Eternal Rose', 'Berry Box', 'Vintage Cigar', 'Magic Potion', 'Kissed Frog', 'Hex Pot', 'Evil Eye', 'Sharp Tongue', 'Trapped Heart', 'Skull Flower', 'Scared Cat', 'Spy Agaric', 'Homemade Cake', 'Genie Lamp', 'Lunar Snake', 'Party Sparkler', 'Jester Hat', 'Witch Hat', 'Hanging Star', 'Love Candle', 'Cookie Heart', 'Desk Calendar', 'Jingle Bells', 'Snow Mittens', 'Voodoo Doll', 'Mad Pumpkin', 'Hypno Lollipop', 'B-Day Candle', 'Bunny Muffin', 'Astral Shard', 'Flying Broom', 'Crystal Ball', 'Eternal Candle', 'Swiss Watch', 'Ginger Cookie', 'Mini Oscar', 'Lol Pop', 'Ion Gem', 'Star Notepad', 'Loot Bag', 'Love Potion', 'Toy Bear', 'Diamond Ring', 'Sakura Flower', 'Sleigh Bell', 'Top Hat', 'Record Player', 'Winter Wreath', 'Snow Globe', 'Electric Skull', 'Tama Gadget', 'Candy Cane', 'Neko Helmet', 'Jack-in-the-Box', 'Easter Egg', 'Bonded Ring', 'Pet Snake', 'Snake Box', 'Xmas Stocking', 'Big Year', 'Holiday Drink', 'Gem Signet', 'Light Sword', 'Restless Jar', 'Nail Bracelet', 'Heroic Helmet', 'Bow Tie', 'Heart Locket', 'Lush Bouquet', 'Whip Cupcake', 'Joyful Bundle', 'Cupid Charm', 'Valentine Box', 'Snoop Dogg', 'Swag Bag', 'Snoop Cigar', 'Low Rider', 'Westside Sign', 'Stellar Rocket', 'Jolly Chimp', 'Moon Pendant', 'Ionic Dryer', 'Input Key', 'Mighty Arm', 'Artisan Brick', 'Clover Pin', 'Sky Stilettos', 'Fresh Socks', 'Happy Brownie', 'Ice Cream', 'Spring Basket', 'Instant Ramen', 'Faith Amulet', 'Mousse Cake', 'Bling Binky', 'Money Pot', 'Pretty Posy', "Khabib's Papakha", 'UFC Strike'];
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]/g,""),CN=Object.fromEntries(NAMES.map(n=>[slug(n),n]));
const R=`market|Маркет|Market|Маркет|Маркет|市场
mine|Мои|Mine|Менікі|Мої|我的
me|Профиль|Profile|Профиль|Профіль|资料
admin|Админ|Admin|Админ|Адмін|管理
buy|Купить|Buy|Сатып алу|Купити|购买
new|Новые|New|Жаңа|Нові|最新
cheap|Дешевле|Cheaper|Арзан|Дешевше|低价
pricey|Дороже|Pricier|Қымбат|Дорожче|高价
empty|Пока пусто|Nothing here yet|Әзірге бос|Поки порожньо|暂无商品
sell|Выставить подарок|List a gift|Сыйлық шығару|Виставити подарунок|上架礼物
sellhint|Передайте подарок @S, выберите картинку и цену. После проверки лот появится в маркете|Send the gift to @S, pick a picture and price. The lot goes live after review|Сыйлықты @S аккаунтына беріңіз, сурет пен бағаны таңдаңыз. Тексерістен кейін лот маркетте шығады|Передайте подарунок @S, оберіть картинку й ціну. Після перевірки лот з'явиться в маркеті|请把礼物转给 @S，选择图片和价格，审核后上架
mylots|Мои лоты|My lots|Менің лоттарым|Мої лоти|我的商品
bought|Покупки|Purchases|Сатып алғандар|Покупки|已购
topup|Пополнить через Tonkeeper|Top up with Tonkeeper|Tonkeeper арқылы толтыру|Поповнити через Tonkeeper|通过 Tonkeeper 充值
topuphint|Откроется Tonkeeper, бот пришлёт кнопку проверки|Tonkeeper opens, the bot sends a check button|Tonkeeper ашылады, бот тексеру батырмасын жібереді|Відкриється Tonkeeper, бот надішле кнопку перевірки|将打开 Tonkeeper，机器人会发送检查按钮
wd|Запросить вывод|Request withdrawal|Шығаруды сұрау|Запросити виведення|申请提现
wdhint|Вручную через поддержку. Рубли: @S|Manual via support. RUB: @S|Қолдау арқылы қолмен. Рубль: @S|Вручну через підтримку. Рублі: @S|由客服手动处理。卢布：@S
amount|Сумма TON|Amount TON|Сома TON|Сума TON|TON 数量
bank|Банк, карта / телефон|Bank, card / phone|Банк, карта / телефон|Банк, картка / телефон|银行、卡号/手机号
done|Готово|Done|Дайын|Готово|完成
confirm|Купить за|Buy for|Сатып алу:|Купити за|购买价格
title|Название|Title|Атауы|Назва|名称
price|Цена в TON|Price in TON|Бағасы TON|Ціна в TON|价格 TON
custom|Своя картинка (https)|Own picture (https)|Өз суретіңіз (https)|Своя картинка (https)|自定义图片 (https)
lang|Язык|Language|Тіл|Мова|语言
open|Откройте через бота|Open via the bot|Бот арқылы ашыңыз|Відкрийте через бота|请通过机器人打开`;
const I={};R.split("\n").forEach(l=>{const[k,...v]=l.split("|");["ru","en","kk","uk","zh"].forEach((g,i)=>(I[g]??={})[k]=v[i])});
let me={},tab="market",sort="new",lg="ru",pick="star",kinds=new Set();
const t=k=>(I[lg]||I.ru)[k].replace("@S","@"+(me.support||"")),$=id=>document.getElementById(id),v=h=>$("v").innerHTML=h;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PH="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='#251c33'/><text x='100' y='128' font-size='84' text-anchor='middle'>🎁</text></svg>");
const pic=i=>i.startsWith("/")?API+i:i.startsWith("n:")?"https://nft.fragment.com/gift/"+i.slice(2)+".medium.jpg":esc(i);
function ierr(e){const s=(e.dataset.s||"").replace(/-\d+$/,"");if(s&&!e.dataset.f){e.dataset.f=1;e.src="https://fragment.com/file/gifts/"+s+"/thumb.webp"}else e.src=PH}
const im=l=>`<img src="${pic(l.image)}" data-s="${l.image.startsWith("n:")?l.image.slice(2):""}" onerror="ierr(this)" loading="lazy" alt="">`;
function demo(p){if(p=="/api/me")return{id:1,username:"demo",balance:12.5,spent:0,admin:true,support:"mrktbanksupports",lang:"ru"};
 if(p.startsWith("/api/listings"))return NAMES.slice(0,30).map((n,i)=>({id:i+1,title:n+" #"+(i*7+1),image:"n:"+slug(n)+"-"+(i*7+1),price:+(2.5+i*1.7).toFixed(1)}));
 if(p=="/api/my")return{selling:[],bought:[]};if(p=="/api/admin")return{stats:{users:3},listings:[],withdrawals:[],sync:{items:0,models:0}};if(p=="/api/models")return[];throw"Demo mode"}
async function api(p,b){if(!tg.initData)return demo(p);const r=await fetch(API+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json","X-Init":tg.initData},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw(typeof j.detail==="string"?j.detail:"Error");return j}
function toast(x){const d=document.createElement("div");d.className="toast pop";d.textContent=x;document.body.append(d);setTimeout(()=>d.remove(),2600)}
async function go(x){tab=x||tab;try{me=await api("/api/me")}catch(e){return v(`<div class="card empty"><div class="e">🔒</div><h2>${t("open")}</h2></div>`)}
 lg=I[me.lang]?me.lang:(I[(tg.initDataUnsafe?.user?.language_code||"").slice(0,2)]?(tg.initDataUnsafe.user.language_code.slice(0,2)):"ru");
 $("bal").textContent="💎 "+(+me.balance).toFixed(2);
 const T=[["market","🛍"],["mine","🎁"],["me","😎"]];if(me.admin)T.push(["admin","🛠"]);
 $("nav").innerHTML=T.map(x=>`<div class="tab ${tab==x[0]?"on":""}" onclick="go('${x[0]}')"><i>${x[1]}</i>${t(x[0])}</div>`).join("");
 try{await({market,mine,me:profile,admin,models}[tab])()}catch(e){toast(e)}}
let LST=[];
async function market(){LST=await api("/api/listings?sort="+sort);
 v(`<input id="q" placeholder="🔍 Plush Pepe, Snoop Dogg…" oninput="fq()"><div class="chips">${[["new","new"],["asc","cheap"],["desc","pricey"]].map(s=>`<div class="chip ${sort==s[0]?"on":""}" onclick="sort='${s[0]}';go()">${t(s[1])}</div>`).join("")}<div class="chip" onclick="go('models')">🎨</div></div><div id="g"></div>`);fq()}
function fq(){const s=($("q").value||"").toLowerCase(),L=LST.filter(l=>(l.title+" "+(l.model||"")+" "+(l.backdrop||"")).toLowerCase().includes(s));
 $("g").innerHTML=L.length?`<div class="grid">${L.map(l=>`<div class="gift pop"><div class="im">${im(l)}<div class="pr">${l.price} TON</div></div><b>${esc(l.title)}</b><small>${esc(l.model||"")}${l.backdrop?" · "+esc(l.backdrop):""}</small><button class="btn" onclick="buy(${l.id},${l.price})">${t("buy")}</button></div>`).join("")}</div>`:`<div class="empty"><div class="e">🦖</div><h2>${t("empty")}</h2></div>`}
async function buy(id,p){if(!confirm(t("confirm")+" "+p+" TON?"))return;try{await api("/api/buy/"+id,{});toast(t("done")+" ✅");tg.HapticFeedback?.notificationOccurred("success");go()}catch(e){toast(e)}}
async function mine(){const m=await api("/api/my");
 v(`<div class="card pop"><h2>${t("sell")}</h2><p>${t("sellhint")}</p>
 <input id="c" list="cl" placeholder="${t("title")}: Plush Pepe"><datalist id="cl">${NAMES.map(n=>`<option value="${n}">`).join("")}</datalist>
 <input id="nn" type="number" placeholder="#"><input id="i" placeholder="${t("custom")}"><input id="p" type="number" step="0.1" placeholder="${t("price")}"><button class="btn" onclick="add()">${t("sell")}</button></div>
 <div class="card"><h2>${t("mylots")}</h2>${m.selling.map(l=>`<div class="row"><span style="display:flex;gap:8px;align-items:center"><span style="width:34px">${im(l)}</span>${esc(l.title)} · ${l.price}</span><span class="st ${l.status}">${l.status}</span></div>`).join("")||`<p>—</p>`}</div>
 <div class="card"><h2>${t("bought")}</h2>${m.bought.map(l=>`<div class="row"><span>${esc(l.title)}</span><span>${l.price} TON</span></div>`).join("")||`<p>—</p>`}</div>`)}
async function add(){try{const n=$("c").value.trim(),s=slug(n),num=+$("nn").value;let img=$("i").value;if(!img){if(!CN[s]||!num)throw"Collection + #";img="n:"+s+"-"+num}
 await api("/api/listings",{title:(CN[s]||n)+(num?" #"+num:""),image:img,price:+$("p").value});toast(t("done")+" ✅");go()}catch(e){toast(e)}}
async function profile(){v(`<div class="card pop"><h2>@${esc(me.username||me.id)}</h2><p>💎 ${(+me.balance).toFixed(2)} TON</p>
 <div class="chips">${[["ru","🇷🇺"],["en","🇬🇧"],["kk","🇰🇿"],["uk","🇺🇦"],["zh","🇨🇳"]].map(x=>`<div class="chip ${lg==x[0]?"on":""}" onclick="setl('${x[0]}')">${x[1]}</div>`).join("")}</div></div>
 <div class="card"><h2>${t("topup")}</h2><p>${t("topuphint")}</p><input id="a" type="number" step="0.5" value="5"><button class="btn b" onclick="dep()">${t("topup")}</button></div>
 <div class="card"><h2>${t("wd")}</h2><p>${t("wdhint")}</p><input id="wa" type="number" step="0.1" placeholder="${t("amount")}"><input id="wd" placeholder="${t("bank")}"><button class="btn y" onclick="wd()">${t("wd")}</button></div>`)}
async function setl(l){await api("/api/lang",{lang:l});go()}
async function dep(){try{const r=await api("/api/deposit",{amount:+$("a").value});tg.openLink(r.link);toast("OK ✅")}catch(e){toast(e)}}
async function wd(){try{await api("/api/withdraw",{amount:+$("wa").value,details:$("wd").value});toast(t("done")+" ✅");go()}catch(e){toast(e)}}
async function admin(){const a=await api("/api/admin"),s=a.stats;
 v(`<div class="card pop"><h2>🧪 Тест-лоты</h2><p>Коллекции через запятую (пусто = все). Цены по тирам редкости, либо задайте диапазон.</p>
 <input id="ks" placeholder="Plush Pepe, Toy Bear, Snoop Dogg"><input id="n" type="number" value="100"><div style="display:flex;gap:8px"><input id="p1" type="number" placeholder="Цена от"><input id="p2" type="number" placeholder="до"></div>
 <button class="btn" onclick="seed()">Создать пачку</button><div style="height:10px"></div><button class="btn r" onclick="clr()">Убрать все активные тест-лоты</button></div>
 <div class="card"><h2>🎨 Картинки с Fragment</h2><p>В базе: ${a.sync.items} подарков, ${a.sync.models} моделей. ${a.sync.running?`Идёт загрузка ${a.sync.done}/${a.sync.total}…`:""}</p><input id="sp" type="number" value="10" placeholder="Подарков на коллекцию"><button class="btn b" onclick="syn()">Скачать модели и подарки</button></div>
 <div class="card"><h2>Статистика</h2>${Object.entries(s).map(([k,x])=>`<div class="row"><span>${k}</span><b>${+(+x).toFixed(2)}</b></div>`).join("")}</div>
 <div class="card"><h2>Лоты (последние 150)</h2>${a.listings.map(l=>`<div class="row"><span style="display:flex;gap:8px;align-items:center"><span style="width:34px;border-radius:9px;overflow:hidden">${im(l)}</span>${esc(l.title)} · ${l.price}</span><span style="display:flex;gap:6px;align-items:center"><span class="st ${l.status}">${l.status}</span>${l.status=="pending"?`<button class="btn s" onclick="ap(${l.id})">✓</button>`:""}${l.status!="sold"?`<button class="btn s r" onclick="dl(${l.id})">✕</button>`:""}</span></div>`).join("")||"<p>—</p>"}</div>
 <div class="card"><h2>Выводы</h2>${a.withdrawals.map(w=>`<div class="row"><span>#${w.id} ${w.amount} TON<br><small>${esc(w.details)}</small></span><button class="btn s b" onclick="pd(${w.id})">Выплачено</button></div>`).join("")||"<p>—</p>"}</div>`)}
const syn=()=>act("/api/admin/sync",{per:+$("sp").value||10});
const act=async(p,b)=>{try{await api(p,b||{});go()}catch(e){toast(e)}};
const ap=i=>act("/api/admin/listing/"+i),dl=i=>act("/api/admin/del/"+i),pd=i=>act("/api/admin/withdraw/"+i),clr=()=>act("/api/admin/clear");
const seed=()=>act("/api/admin/seed",{kinds:$("ks").value.split(",").map(x=>x.trim()).filter(Boolean),count:+$("n").value,pmin:+$("p1").value,pmax:+$("p2").value});
async function models(){const L=await api("/api/models");v(`<div class="chips"><div class="chip" onclick="go('market')">← ${t("market")}</div></div>`+(L.length?`<div class="grid">${L.map(m=>`<div class="gift pop"><div class="im"><img src="${pic(m.file)}" onerror="this.src=PH" loading="lazy" alt=""></div><b>${esc(m.name||"?")}</b><small>${esc(CN[m.slug]||m.slug)}</small></div>`).join("")}</div>`:`<div class="empty"><div class="e">🎨</div><h2>${t("empty")}</h2></div>`))}
go();
</script></body></html>
