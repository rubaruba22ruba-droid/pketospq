const UP=new Set();D.l=DF.map(([n,x],i)=>{const num=37+i*53%700;let p=+(x*(1+(i*7%30)/100)).toPrecision(x<10?3:4);while(UP.has(p))p=+(p+.01).toFixed(2);UP.add(p);return{id:i+1,owner:2,slug:sl(n),num,title:n+" #"+num,image:"",model:["Neon","Royal","Mint","Onyx","Amber","Frost"][i%6],backdrop:["Copper","Rose","Lavender","Steel","Jade","Sand"][(i*5)%6],price:p}});
D.i=[["Toy Bear",412],["Heart Locket",88],["Snoop Dogg",9],["Plush Pepe",1203]].map(([n,num],i)=>({id:100+i,owner:1,slug:sl(n),num,title:n+" #"+num,image:"",model:["Lime","Cobalt","Ruby","Gold"][i],backdrop:["Steel","Jade","Copper","Rose"][i],status:"own",price:null}));
function demo(p,b){const m=p.match(/\/(\d+)$/),id=m&&+m[1],H=(k)=>{throw k};
 if(p=="/api/me")return D.me;if(p=="/api/floors")return DF.map(([n,x])=>({slug:sl(n),name:n,floor:+x}));
 if(p=="/api/listings")return D.l.slice().reverse();if(p=="/api/inventory")return{items:[...D.i,...D.l.filter(l=>l.owner==1)].sort((a,c)=>c.id-a.id)};
 if(p.startsWith("/api/buy/")){const l=D.l.find(x=>x.id==id);if(!l)H("Лот уже продан или снят");if(D.me.balance<l.price)H("Недостаточно средств на балансе");D.me.balance-=l.price;D.me.spent+=l.price;D.l=D.l.filter(x=>x!=l);D.i.push({...l,id:D.nid++,owner:1,status:"own",price:null});return{ok:1}}
 if(p.startsWith("/api/sell/")){const g=D.i.find(x=>x.id==id),x=F[g.slug]?.floor||0;if(!(b.price>0))H("Укажите цену");if(b.price<x*.3)H("Цена слишком низкая, флор коллекции "+x+" GRAM");D.i=D.i.filter(z=>z!=g);D.l.push({...g,owner:1,status:"sale",price:b.price});return{ok:1}}
 if(p.startsWith("/api/unsell/")){const l=D.l.find(x=>x.id==id);D.l=D.l.filter(x=>x!=l);D.i.push({...l,status:"own",price:null});return{ok:1}}
 if(p.startsWith("/api/giftout/")){D.i.find(x=>x.id==id).status="out";return{ok:1}}
 if(p=="/api/deposit"){D.me.balance+=b.amount;return{link:""}}
 if(p=="/api/withdraw"){if(b.amount<=0||b.amount>D.me.balance)H("Недостаточно средств");D.me.balance-=b.amount;return{id:1}}
 if(p=="/api/lang"){D.me.lang=b.lang;return{ok:1}}
 if(p=="/api/admin")return{stats:{users:3,listings:D.l.length},out:[],withdrawals:[],sync:{items:0,models:0}};return{ok:1}}
async function api(p,b){if(DEMO)return demo(p,b);const r=await fetch(API+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json","X-Init":tg.initData},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw(typeof j.detail==="string"?j.detail:"Ошибка запроса");return j}
function toast(x){const d=document.createElement("div");d.className="toast";d.textContent=x;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function openSh(h){$("pn").innerHTML=h;$("sh").classList.add("on")}function closeSh(){$("sh").classList.remove("on")}
const setLg=m=>{const c=m.lang||(tg.initDataUnsafe?.user?.language_code||"").slice(0,2);lg=LG.includes(c)?c:"ru";document.documentElement.lang=lg};
const T0=Date.now();
async function boot(){try{await document.fonts.ready}catch(e){}pg(35);
 try{[me,F]=await Promise.all([api("/api/me"),api("/api/floors")]);F=Object.fromEntries(F.map(x=>[x.slug,x]));cur=me.cur||"GRAM";setLg(me);pg(70);await go("market");pg(100)}
 catch(e){v(`<div class="empty"><h2>${t("Откройте через бота")}</h2><p>${t("Мини-апп работает только внутри Telegram.")}</p></div>`)}
 setTimeout(()=>{$("sp").classList.add("gone");setTimeout(()=>$("sp").remove(),450)},Math.max(350,1900-(Date.now()-T0)))}
async function go(x){tab=x||tab;closeSh();me=await api("/api/me");$("bal").textContent=f(me.balance)+" "+cur;
 const T=[["market","Маркет"],["inv","Инвентарь"],["me","Профиль"]];if(me.admin)T.push(["admin","Админ"]);
 $("nav").innerHTML=T.map(x=>`<button class="${tab==x[0]?"on":""}" onclick="go('${x[0]}')">${t(x[1])}</button>`).join("");
 try{await({market,inv,me:profile,admin})[tab]()}catch(e){toast(e)}scrollTo(0,0)}
async function market(){v(`<input id="q" class="in" placeholder="${t("Коллекция, модель, фон")}" oninput="fq()"><div class="seg">${[["new","Новые"],["asc","Дешевле"],["desc","Дороже"],["flr","Ниже рынка"]].map(s=>`<button class="${sort==s[0]?"on":""}" onclick="sort='${s[0]}';market()">${t(s[1])}</button>`).join("")}</div><div id="g"><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>`);
 LST=await api("/api/listings");ANIM=1;fq();ANIM=0}
const sb=g=>esc([g.model,g.backdrop].filter(Boolean).join(", "));
function fq(){const s=($("q")?.value||"").toLowerCase();let L=LST.filter(l=>(l.title+" "+(l.model||"")+" "+(l.backdrop||"")).toLowerCase().includes(s));
 const d=l=>l.price/(fl(l)||l.price);L.sort(sort=="asc"?(a,b)=>a.price-b.price:sort=="desc"?(a,b)=>b.price-a.price:sort=="flr"?(a,b)=>d(a)-d(b):(a,b)=>b.id-a.id);
 $("g").innerHTML=L.length?`<div class="grid">${L.map((l,i)=>`<button class="t${ANIM?" in":""}" style="animation-delay:${Math.min(i,10)*50}ms" onclick="lot(${l.id})"><div class="im">${im(l)}</div><div class="bd"><div class="nm">${esc(l.title)}</div><div class="sb">${sb(l)}</div><div class="pr"><span>${f(l.price)} ${cur}<em>${usd(l.price)} USDT</em></span>${dl(l)}</div></div></button>`).join("")}</div>`:emp("Ничего не найдено","Измените запрос или сортировку.")}
const attrs=g=>[["Модель",g.model],["Фон",g.backdrop],["Символ",g.symbol]].filter(a=>a[1]).map(a=>`<div class="row"><span>${t(a[0])}</span><b>${esc(a[1])}</b></div>`).join("");
const both=n=>`${f(n)} ${cur} <span class="sub">${usd(n)} USDT</span>`;
const hd=g=>`<div class="big">${im(g)}</div><h2 style="text-align:center;margin:0 0 12px">${esc(g.title)}</h2>`;
function lot(id){const l=LST.find(x=>x.id==id);if(!l)return;const mine=l.owner==me.id,short=me.balance<l.price;
 openSh(`${hd(l)}<div class="card">${attrs(l)}<div class="row"><span>${t("Цена")}</span><b>${both(l.price)}</b></div><div class="row"><span>${t("Ваш баланс")}</span><b>${both(me.balance)}</b></div></div>
 ${mine?`<button class="btn g" onclick="unsell(${l.id})">${t("Снять с продажи")}</button>`:short?`<button class="btn" onclick="go('me')">${t("Пополнить баланс")}</button>`:`<button class="btn" id="bb" onclick="buy(${l.id})">${t("Купить за")} ${f(l.price)} ${cur}</button>`}`)}
async function buy(id){const l=LST.find(x=>x.id==id);$("bb").disabled=true;try{await api("/api/buy/"+id,{});tg.HapticFeedback?.notificationOccurred("success");closeSh();celebrate(l);toast(t("Куплено. Подарок в вашем инвентаре"));tab="inv";setTimeout(go,950)}catch(e){toast(e);$("bb").disabled=false}}
async function inv(){INV=(await api("/api/inventory")).items;const S={own:"У вас",sale:"В продаже",out:"Вывод"};
 v(`<h2>${t("Инвентарь")}</h2>`+(INV.length?`<div class="grid">${INV.map(g=>`<button class="t" onclick="mine(${g.id})"><div class="im">${im(g)}</div><div class="bd"><div class="nm">${esc(g.title)}</div><div class="sb">${sb(g)}</div><div class="pr"><span class="tag ${g.status=="sale"?"a":""}">${t(S[g.status])}</span>${g.status=="sale"?`<span>${f(g.price)}</span>`:""}</div></div></button>`).join("")}</div>`:emp("Здесь пока пусто","Подарки, которые вы отправили на маркет или купили, появятся здесь.")))}
function mine(id){const g=INV.find(x=>x.id==id),x=fl(g),at=attrs(g);
 const body=g.status=="own"?`<h3>${t("Цена в")} ${cur}</h3><input id="pp" class="in" type="number" inputmode="decimal" step="any" value="${x||""}" oninput="rc()"><p style="margin:-4px 0 2px">${t("Рыночная цена")}: ${both(x)}</p><p id="rc" style="margin:0 0 14px"></p><button class="btn" onclick="sell(${g.id})">${t("Выставить на продажу")}</button><button class="lk" onclick="gout(${g.id})">${t("Вывести подарок")}</button>`
 :g.status=="sale"?`<div class="card"><div class="row"><span>${t("Цена")}</span><b>${both(g.price)}</b></div></div><button class="btn g" onclick="unsell(${g.id})">${t("Снять с продажи")}</button>`:`<p style="text-align:center">${t("Заявка на вывод создана")}</p>`;
 openSh(`${hd(g)}${at?`<div class="card">${at}</div>`:""}${body}`);if(g.status=="own")rc()}
function rc(){const p=+$("pp").value||0,fe=me.fee||0;$("rc").textContent=p?`${t("Вы получите")} ${f(p*(1-fe))} ${cur} (${usd(p*(1-fe))} USDT)`+(fe?`, ${t("после комиссии")} ${Math.round(fe*100)}%`:""):""}
async function sell(id){try{await api("/api/sell/"+id,{price:+$("pp").value});toast(t("Выставлено в маркет"));go()}catch(e){toast(e)}}
async function unsell(id){try{await api("/api/unsell/"+id,{});toast(t("Снято с продажи"));go()}catch(e){toast(e)}}
async function gout(id){try{await api("/api/giftout/"+id,{});toast(t("Заявка на вывод создана"));go()}catch(e){toast(e)}}
async function profile(){v(`<h2>@${esc(me.username||me.id)}</h2><div class="card"><div class="row"><span>${t("Баланс")}</span><b>${both(me.balance)}</b></div><div class="row"><span>${t("Потрачено")}</span><b>${both(me.spent)}</b></div><div class="row"><span>${t("Язык")}</span><div class="lg">${[["ru","ru"],["en","eng"],["kk","kk"],["uk","uk"],["zh","zh"]].map(x=>`<button class="${lg==x[0]?"on":""}" onclick="setl('${x[0]}')">${x[1]}</button>`).join("")}</div></div></div>
 <div class="card"><h3>${t("Пополнить")}</h3><p style="margin-bottom:10px">${t("Откроется Tonkeeper, зачисление придёт автоматически.")}</p><input id="a" class="in" type="number" inputmode="decimal" value="5"><button class="btn" onclick="dep()">${t("Пополнить")}</button></div>
 <div class="card"><h3>${t("Вывести средства")}</h3><p style="margin-bottom:10px">${t("Оставьте заявку, выплата придёт на указанные реквизиты.")}</p><input id="wa" class="in" type="number" inputmode="decimal" placeholder="${t("Сумма")}, ${cur}"><input id="wd" class="in" placeholder="${t("Кошелёк или карта")}"><button class="btn g" onclick="wd()">${t("Оставить заявку")}</button></div>`)}
async function setl(l){lg=l;try{await api("/api/lang",{lang:l})}catch(e){}go()}
async function dep(){try{const r=await api("/api/deposit",{amount:+$("a").value});if(r.link)tg.openLink(r.link);else go()}catch(e){toast(e)}}
async function wd(){try{await api("/api/withdraw",{amount:+$("wa").value,details:$("wd").value});toast(t("Заявка на вывод создана"));go()}catch(e){toast(e)}}
const act=async(p,b)=>{try{await api(p,b||{});go()}catch(e){toast(e)}};
async function admin(){const a=await api("/api/admin"),s=a.stats;
 v(`<h2>Админ</h2><div class="card"><h3>Выдать подарок в инвентарь</h3><p style="margin-bottom:10px">Когда подарок пришёл на аккаунт маркета.</p><input id="cu" class="in" placeholder="@username или ID"><input id="cc" class="in" list="cl" placeholder="Коллекция"><datalist id="cl">${Object.values(F).map(x=>`<option value="${esc(x.name)}">`).join("")}</datalist><input id="cn" class="in" type="number" placeholder="Номер подарка"><button class="btn" onclick="crd()">Выдать</button></div>
 <div class="card"><h3>Заявки на вывод подарков</h3>${a.out.map(o=>`<div class="row"><span>#${o.id} ${esc(o.title)}<br>${o.owner}</span><button class="btn s" onclick="act('/api/admin/gift/${o.id}')">Передан</button></div>`).join("")||"<p>Нет заявок</p>"}</div>
 <div class="card"><h3>Заявки на вывод средств</h3>${a.withdrawals.map(w=>`<div class="row"><span>#${w.id} ${f(w.amount)} ${cur}<br>${esc(w.details)}</span><button class="btn s" onclick="act('/api/admin/withdraw/${w.id}')">Выплачено</button></div>`).join("")||"<p>Нет заявок</p>"}</div>
 <div class="card"><h3>Тестовые лоты по флору</h3><p style="margin-bottom:10px">Каждый лот из другой коллекции, цена от флора до +30%, цены не повторяются. Коллекции через запятую, пусто значит все.</p><input id="ks" class="in" placeholder="Plush Pepe, Toy Bear"><input id="n" class="in" type="number" value="60"><button class="btn" onclick="act('/api/admin/seed',{kinds:$('ks').value.split(',').map(x=>x.trim()).filter(Boolean),count:+$('n').value})">Создать</button><div style="height:8px"></div><button class="btn g" onclick="act('/api/admin/clear')">Убрать мои лоты из маркета</button></div>
 <div class="card"><h3>Картинки с Fragment</h3><p style="margin-bottom:10px">В базе ${a.sync.items} подарков, ${a.sync.models} моделей${a.sync.running?`. Загрузка ${a.sync.done}/${a.sync.total}`:""}</p><input id="sp2" class="in" type="number" value="10"><button class="btn g" onclick="act('/api/admin/sync',{per:+$('sp2').value||10})">Скачать</button></div>
 <div class="card"><h3>Статистика</h3>${Object.entries(s).map(([k,x])=>`<div class="row"><span>${k}</span><b>${+(+x).toFixed(2)}</b></div>`).join("")}</div>`)}
const crd=()=>act("/api/admin/credit",{user:$("cu").value,collection:$("cc").value,num:+$("cn").value});
fly();boot();
</script></body></html>
