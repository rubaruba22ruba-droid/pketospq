<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="google" content="notranslate"><meta name="theme-color" content="#0b0f1a">

<title>.tron mrkt</title><style>
:root{--bg:#0b0f1a;--s:#121829;--s2:#1a2236;--ln:#222b42;--tx:#f2f4f8;--mu:#8b95ab;--ac:#ff8a1f;--ice:#8fd3ff;--ok:#4fe0a0;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font:500 15px/1.4 Manrope,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);padding:calc(env(safe-area-inset-top) + 4px) 16px calc(104px + env(safe-area-inset-bottom));min-height:100vh;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main,.tk{position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.03em}.logo i,.wm i{font-style:normal;color:var(--ac)}.mk{height:44px;width:auto}
.bal{background:var(--s);border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer}
.tk{overflow:hidden;margin:0 -16px 14px;background:var(--s)}#tk{display:inline-flex;white-space:nowrap;padding:9px 0;animation:tk 80s linear infinite}#tk span{margin-right:28px;font-size:12.5px;font-weight:800}#tk em{font-style:normal;color:var(--mu);font-weight:600;margin-right:5px}@keyframes tk{to{transform:translateX(-50%)}}
h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:6px 0 14px}h3{font-size:15px;font-weight:700;margin-bottom:6px}
p{color:var(--mu);font-size:14px}.sec{display:flex;align-items:baseline;justify-content:space-between}.sec h2{margin-bottom:12px}
.in{width:100%;background:var(--s);border:0;border-radius:var(--r);padding:15px 16px;font-size:16px;outline:none;margin-bottom:10px}.in:focus{box-shadow:0 0 0 2px var(--ac)}.in::placeholder{color:var(--mu)}
.seg{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:var(--s);border:0;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--mu);cursor:pointer}.seg button.on{background:var(--tx);color:var(--bg);font-weight:700}
.srt{display:flex;gap:18px;margin:2px 0 14px}.srt button{background:none;border:0;padding:4px 0;font-size:13.5px;font-weight:700;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent}.srt button.on{color:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{display:block;width:100%;text-align:left;background:var(--s);border:0;border-radius:var(--r);padding:6px 6px 10px;cursor:pointer;transition:transform .12s}.t:active{transform:scale(.97)}
.t .im{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:var(--s2)}.im img,.ph img{width:100%;height:100%;display:block;object-fit:cover}
.nb,.dc{position:absolute;top:7px;background:#0b0f1ab8;backdrop-filter:blur(6px);border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:700}.nb{left:7px}.dc{right:7px;color:var(--ok)}
.t .bd{padding:9px 6px 0}.r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mu{color:var(--mu);font-size:13px}
.sb{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}
.pr{margin-top:6px;font-weight:800;font-size:16px}.pr span{font-size:12px;color:var(--mu);font-weight:600}.us{font-size:11.5px;color:var(--mu)}
.buy{margin-top:9px;background:var(--ac);color:#1c0e02;border-radius:11px;padding:10px;display:flex;justify-content:center;align-items:baseline;gap:5px;font-weight:800;font-size:15px}.buy span{font-size:11px;font-weight:700;opacity:.65}.t .us{text-align:center;margin-top:6px}
.t.in2{animation:ti .4s cubic-bezier(.2,.8,.3,1) backwards}@keyframes ti{from{opacity:0;transform:translateY(14px)}}
.sk{aspect-ratio:.78;border-radius:var(--r);background:var(--s);animation:pl 1.3s ease-in-out infinite}@keyframes pl{50%{opacity:.5}}
.btn{width:100%;background:var(--ac);color:#1c0e02;border:0;border-radius:var(--r);padding:16px;font-weight:800;font-size:16px;cursor:pointer;transition:transform .1s,opacity .15s}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.btn.g{background:var(--s2);color:var(--tx)}.btn.s{width:auto;padding:9px 15px;font-size:14px}
.card{background:var(--s);border-radius:var(--r);padding:4px 16px;margin-bottom:12px}.card.p{padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);font-size:14.5px}.row:last-child{border:0}.row>span:first-child{color:var(--mu)}.row b{font-weight:700;text-align:right}.sub{font-size:12px;font-weight:600;color:var(--mu)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--s2);color:var(--mu)}.tag.a{background:#ff8a1f26;color:var(--ac)}
.hero{background:var(--s);border-radius:24px;padding:22px;margin-bottom:12px}.hero .n{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin:4px 0}.hero .n i{font-style:normal;font-size:16px;color:var(--mu);font-weight:700;letter-spacing:0}.acts{display:flex;gap:10px;margin-top:18px}
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;display:flex;gap:4px;background:#121829f2;backdrop-filter:blur(18px);border-radius:26px;padding:6px}
nav button{flex:1;background:none;border:0;border-radius:20px;padding:9px 4px 7px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700}nav button.on{background:var(--s2);color:var(--ac)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sh{position:fixed;inset:0;z-index:20;display:none}#sh.on{display:block}#sh .bk{position:absolute;inset:0;background:#000b}
#sh .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(36px);opacity:0}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px}
.big{position:relative;width:60%;margin:30px auto 18px}.ph{border-radius:22px;overflow:hidden;aspect-ratio:1;background:var(--s)}.hat{position:absolute;width:42%;left:55%;top:-17%;transform:translateX(-50%) rotate(-5deg);z-index:2;filter:drop-shadow(0 4px 6px #0006)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.chip{background:var(--s);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700}.chip small{display:block;color:var(--mu);font-size:11px;font-weight:600}
.pb{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 0 16px}.pb small{display:block;color:var(--mu);font-size:12px;font-weight:600}.pb b{font-size:32px;font-weight:800;letter-spacing:-.03em}.pb b i{font-style:normal;font-size:14px;color:var(--mu);font-weight:700;letter-spacing:0}
.bl{text-align:center;margin-top:12px;font-size:13px}
.lk{display:block;margin:16px auto 0;background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline;cursor:pointer}
.lg{display:inline-flex;background:var(--s2);border-radius:999px;padding:3px;gap:2px}.lg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--mu);cursor:pointer}.lg button.on{background:var(--tx);color:var(--bg)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:16px;right:16px;z-index:60;background:var(--tx);color:var(--bg);padding:13px 16px;border-radius:var(--r);font-weight:700;text-align:center}
.empty{text-align:center;padding:56px 8px}
#sp{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .45s}#sp.gone{opacity:0;pointer-events:none}
.lgs{width:112px;height:auto;animation:lp .8s cubic-bezier(.2,.9,.3,1) both}@keyframes lp{from{opacity:0;transform:translateY(10px) scale(.92)}}
.wm{font-size:30px;font-weight:800;letter-spacing:-.03em;animation:fi .6s .25s both}@keyframes fi{from{opacity:0}}
#sp .ln{width:96px;height:2px;background:var(--s2);border-radius:2px;overflow:hidden;animation:fi .6s .35s both}#sp .ln u{display:block;height:100%;width:8%;background:var(--ac);transition:width .4s}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
